name: Run `terraform destroy -auto-approve`

#checkov:skip=CKV2_GHA_1:Ensure top-level permissions are not set to write-all

on:
  workflow_call:
    inputs:
      cloud_provider:
        required: true
        type: string
      terraform_directory:
        required: false
        type: string
        default: "."
      terraform_logging:
        required: false
        type: string
        default: "off"
      terraform_provider_network_mirror:
        required: false
        type: string
        default: "https://repo1.site.com/artifactory/api/terraform/terraform-virtual/providers/"
      terraform_version:
        required: false
        type: string
        default: "1.6.2"
      target_subscription_id:
        required: false
        type: string
        default: ""

      azcli_version:
        required: false
        type: string
        default: latest
      azure_client_id:
        required: false
        type: string
      azure_tenant_id:
        required: false
        type: string
      branch_ref:
        required: true
        type: string
      ca_bundle_file_path:
        required: false
        type: string
        default: ""
      environment_name:
        required: false
        type: string
      job_name:
        required: false
        type: string
      ref:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: ubuntu-latest
      shared_tfvar_files:
        required: false
        type: string
        default: ""
      shared_tfvar_values:
        required: false
        type: string
        default: ""
      tfvars:
        required: false
        type: string
        default: ""

      state_az_rg_name:
        required: false
        type: string
      tfstate_az_container_name:
        required: false
        type: string
      state_az_storage_name:
        required: false
        type: string
      state_az_subscription_id:
        required: false
        type: string
      remote_state_key:
        required: false
        type: string

    secrets:
      AZ_CLIENT_SECRET:
        required: false
      CA_BUNDLE:
        required: false
      GH_TOKEN:
        required: false
      APP_PRIVATE_KEY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Destroy ${{ inputs.job_name }}
    runs-on: ${{ !startsWith(inputs.terraform_provider_network_mirror, 'https://registry.terraform.io') && 'ubuntu-latest' || inputs.runner != '' && inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.terraform_directory }}
    env:
      TARGET_SUBSCRIPTION_ID: ${{ inputs.target_subscription_id }}
      ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
      ARM_CLIENT_SECRET: ${{ secrets.AZ_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.state_az_subscription_id }}
      ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
      ARM_USE_OIDC: ${{ secrets.AZ_CLIENT_SECRET == '' }}
      CA_BUNDLE: ${{ secrets.CA_BUNDLE }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      # TF_CLI_CONFIG_FILE: ${{ !startsWith(inputs.terraform_provider_network_mirror, 'https://registry.terraform.io') && '.terraformrc' || '' }}
      TF_LOG: ${{ inputs.terraform_logging }}

      azcli_version: ${{ inputs.azcli_version }}
      branch_ref: ${{ inputs.branch_ref }}
      ca_bundle_file_path: ${{ inputs.ca_bundle_file_path }}
      cloud_provider: ${{ inputs.cloud_provider }}
      job_name: ${{ inputs.job_name }}
      runner: ${{ !startsWith(inputs.terraform_provider_network_mirror, 'https://registry.terraform.io') && 'ubuntu-latest' || inputs.runner }}
      shared_tfvar_files: ${{ inputs.shared_tfvar_files }}
      shared_tfvar_values: ${{ inputs.shared_tfvar_values }}
      tfvars: ${{ inputs.tfvars }}

      state_az_rg_name: ${{ inputs.state_az_rg_name }}
      tfstate_az_container_name: ${{ inputs.tfstate_az_container_name }}
      state_az_storage_name: ${{ inputs.state_az_storage_name }}
      remote_state_key: ${{ inputs.remote_state_key }}
    environment:
      name: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: create terraformc
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            cd ~
            touch .terraformrc

          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "windows os"
            echo "# terraform.rc " >> $env:APPDATA
          else
            echo "$RUNNER_OS not supported"
              # exit 1
          fi
      - name: Validate `cloud_provider` input
        run: |
          if [[ "${cloud_provider}" != "azure" ]]; then
            echo 'The specified `cloud_provider` value is invalid: `${{ inputs.cloud_provider }}`. Acceptable values is `azure`.'
            exit 1
          fi

      - name: Install CA bundle
        if: ${{ inputs.ca_bundle_file_path != '' }}
        run: |
          echo "Installing CA bundle to ${ca_bundle_file_path}"
          echo "${CA_BUNDLE}" >> ${ca_bundle_file_path}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Get installed Azure CLI version
        id: installed_azcli
        if: ${{ env.cloud_provider == 'azure' }}
        run: |
          version=$(az version | jq -r '."azure-cli"')
          echo "version = ${version}"
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TF_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ vars.TF_OWNER_ORG_NAME }}
    
      - run: |
          git config --global url."https://oauth2:${{ steps.app-token.outputs.token }}@github.com".insteadOf https://github.com
    
      - name: Set backend config key
        run: |
          if [ -z "${remote_state_key}" ]; then
            if [[ "${cloud_provider}" == 'swa' ]]; then # SWA
              remote_state_key="${remote_state_swa_state_folder}/${remote_state_swa_state_folder}-${branch_ref}-${job_name}.tfstate"
            else # Azure
              remote_state_key="${{ inputs.environment_name }}-${job_name}.tfstate"
            fi
          fi
          echo "remote_state_key = $remote_state_key"
          echo "remote_state_key=${remote_state_key}" >> $GITHUB_ENV

      - name: Parse `tfvars` JSON
        id: parse_tfvars
        run: |
          tfvar_files=''
          tfvar_files_json_string=$(echo ${tfvars} | jq -c .files)
          echo "tfvar_files_json_string = ${tfvar_files_json_string}"
          if [[ "${tfvar_files_json_string}" != 'null' ]]; then
            tfvar_files_entries=$(jq -r '. | to_entries | .[] | .value' <<< "${tfvar_files_json_string}")
            tfvar_files_array=($tfvar_files_entries)

            for key in "${!tfvar_files_array[@]}"
            do
              tfvar_files="${tfvar_files} -var-file='${tfvar_files_array[$key]}'"
            done
          fi

          tfvar_files="$(echo "${tfvar_files}" | xargs)"
          echo "tfvar_files = '${tfvar_files}'"
          echo "tfvar_files=${tfvar_files}" >> $GITHUB_OUTPUT

          tfvar_values=''
          tfvar_values_json_string=$(echo ${tfvars} | jq -c .values)
          if [[ "${tfvar_values_json_string}" != 'null' ]]; then
            tfvar_values_entries=$(jq -r '. | to_entries | .[] | .key + "=" + .value' <<< "${tfvar_values_json_string}")
            tfvar_values_array=($tfvar_values_entries)

            for key in "${!tfvar_values_array[@]}"
            do
              tfvar_values="${tfvar_values} -var='${tfvar_values_array[$key]}'"
            done
          fi

          tfvar_values="$(echo "${tfvar_values}" | xargs)"
          echo "tfvar_values = '${tfvar_values}'"
          echo "tfvar_values=${tfvar_values}" >> $GITHUB_OUTPUT

      - name: Authenticate Azure CLI using OIDC
        if: ${{ env.cloud_provider == 'azure' && env.ARM_CLIENT_SECRET == '' }}
        uses: Azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}

      # - name: Retrieve destroy plan
      #   run: |
      #     if [[ "${cloud_provider}" != 'azure' ]]; then # SWA
      #       echo "NOT supported"
      #     else # Azure
      #       echo 'Retrieving "destroy-${{ env.plan_name }}" plan file from "${{ env.state_az_container_name }}" Storage Container...'
      #       # Using Azure/login@v2 for client secret causes the subscription ID to be flagged as a secret and omitted from output
      #       if [[ "${{ secrets.AZ_CLIENT_SECRET }}" != "" ]]; then
      #         az login --service-principal -u ${{ env.ARM_CLIENT_ID }} -p ${{ secrets.AZ_CLIENT_SECRET }} --tenant ${{ env.ARM_TENANT_ID }} --output none
      #       fi

      #       az account set --subscription ${ARM_SUBSCRIPTION_ID}
      #       az storage blob download --auth-mode login --file "destroy-${{ env.plan_name }}" --account-name ${state_az_storage_name} --container-name ${state_az_container_name} --name destroy-${{ env.plan_name }}
      #     fi
  
      - name: "Run terraform init with remote state :: ${{ env.remote_state_key }}"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          az account show
          echo "set target subscription id: env [${{ env.TARGET_SUBSCRIPTION_ID }}] - shell [${inputs.target_subscription_id}]"
          az account set -s '${{ env.TARGET_SUBSCRIPTION_ID }}'
          
          if [[ "${cloud_provider}" == 'azure' && '${{ env.ARM_CLIENT_SECRET }}' != '' ]]; then # Azure w/ client secret
            terraform init \
              -input=false \
              -backend-config=tenant_id=${{ env.ARM_TENANT_ID }} \
              -backend-config=subscription_id=${{ env.TARGET_SUBSCRIPTION_ID }} \
              -backend-config=client_id=${{ env.ARM_CLIENT_ID }} \
              -backend-config=client_secret=${{ env.ARM_CLIENT_SECRET }} \
              -backend-config=resource_group_name=${{ env.state_az_rg_name }} \
              -backend-config=storage_account_name=${{ env.state_az_storage_name }} \
              -backend-config=container_name=${{ env.tfstate_az_container_name }} \
              -backend-config=key=${{ env.remote_state_key }}
          else # Azure w/ OIDC
            terraform init \
              -backend-config=tenant_id=${{ env.ARM_TENANT_ID }} \
              -backend-config=subscription_id=${{ env.TARGET_SUBSCRIPTION_ID }} \
              -backend-config=client_id=${{ env.ARM_CLIENT_ID }} \
              -backend-config=resource_group_name=${{ env.state_az_rg_name }} \
              -backend-config=storage_account_name=${{ env.state_az_storage_name }} \
              -backend-config=container_name=${{ env.tfstate_az_container_name }} \
              -backend-config=key=${{ env.remote_state_key }}
          fi

      - name: Run terraform destroy ${{ inputs.shared_tfvar_files }} ${{ inputs.shared_tfvar_values }} ${{ steps.parse_tfvars.outputs.tfvar_files }} ${{ steps.parse_tfvars.outputs.tfvar_values }} -input=false -auto-approve
        run: |
          az account show
          echo "env [${{ env.TARGET_SUBSCRIPTION_ID }}] - shell [${TARGET_SUBSCRIPTION_ID}]"
          az account set -s '${{ env.TARGET_SUBSCRIPTION_ID }}'
          terraform destroy \
            ${shared_tfvar_files} \
            ${shared_tfvar_values} \
            ${{ steps.parse_tfvars.outputs.tfvar_files }} \
            ${{ steps.parse_tfvars.outputs.tfvar_values }} \
            -input=false \
            -auto-approve
