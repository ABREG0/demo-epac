---

metadata:
name: "Ensure storage for critical data are encrypted with Customer Managed Key"
  id: "CKV2_AZURE_1"
  category: "ENCRYPTION"
  definition:
  or:
    - and:
        - cond_type: filter
          attribute: resource_type
          value:
            - azurerm_storage_account
          operator: within
        - cond_type: connection
          resource_types:
            - azurerm_storage_account
          connected_resource_types:
            - azurerm_storage_account_customer_managed_key
          operator: exists
    - resource_types:
        - azurerm_storage_account
      operator:  exists
      cond_type: attribute
      attribute: customer_managed_key.key_vault_key_id

name: "Ensure storage account is configured without blob anonymous access"
  id: "CKV2_AZURE_47"
  category: "IAM"

  definition:
  and:
    - cond_type: "attribute"
      resource_types: "azurerm_storage_account"
      attribute: "allow_nested_items_to_be_public"
      operator: "exists"

    - cond_type: "attribute"
      resource_types: "azurerm_storage_account"
      attribute: "allow_nested_items_to_be_public"
      operator: "equals_ignore_case"
      value: "false"

  #checkov:skip=CKV2_AZURE_1:Ensure storage for critical data are encrypted with Customer Managed Key
